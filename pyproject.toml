[build-system]
requires = ["setuptools>=64", "wheel", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "gallearn"
dynamic = ["version"]
authors = [
  { name = "Patrick Staudt", email = "patrickstaudt1@gmail.com" },
]
description = "Code to make predictions from FIREBox with a neural network."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }  # or whatever license you’re using
keywords = ["astrophysics", "machine learning", "FIREBox", "neural network"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

dependencies = [
  "numpy",
  "pandas < 3.0.0",
  "matplotlib",
  "h5py",
  "torch",
  "torchvision",
  "wandb",
  "rich",
  "scipy",
  "progressbar2",
  "Pillow",
  "cmasher",
  "astrophot==0.17.3",
  "mockobservation-tools @ git+https://github.com/patricks1/mockobservation-tools.git@v1.1.2b1",
  "uci-tools @ git+https://github.com/Bullock-Group-UC-Irvine/shared-analysis-tools.git",
]

[project.urls]
Homepage = "https://github.com/patricks1/gallearn"

[tool.setuptools]
packages = ["gallearn"]

[tool.setuptools_scm]
