name: CI

on: [push]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Add conda to system path
      run: |
        # $CONDA is an environment variable pointing to the root of the 
        # miniconda directory
        echo $CONDA/bin >> $GITHUB_PATH
    - name: Install dependencies
      run: |
        # environment.yml's pip section (astrophot, FIRE_studio,
        # mockobservation-tools, uci_tools) now installs cleanly under
        # normal build isolation, so the old strip-and-
        # --no-build-isolation workaround is gone.
        #
        # conda env create/update ignore the configured solver and always
        # use the classic SAT solver, which explodes on this unpinned env:
        # after conda-forge shipped a new torch stack on 2026-10-29 it
        # churned ~7h then got OOM-killed, never reaching pytest. mamba
        # resolves the same env in seconds, so install mamba into base and
        # build the gallearn env (environment.yml's own name) with it.
        # Building a separate env instead of updating base also leaves
        # base's python untouched, avoiding a post-link churn when
        # environment.yml pins python 3.10.
        conda install -n base -y -c conda-forge mamba
        mamba env create -f environment.yml
    - name: Lint with flake8
      run: |
        # flake8 is a static linter (no imports), so it lives in base, not
        # the gallearn env. Install it with mamba for a fast solve.
        mamba install -n base -y flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 
        # chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Install gallearn
      run: |
        # Install into the gallearn env, where the project's deps live.
        conda run -n gallearn pip install .
    - name: Test with pytest
      env:
        GALLEARN_CONFIG: .github/config_ci.ini
      run: |
        conda run --no-capture-output -n gallearn pytest
